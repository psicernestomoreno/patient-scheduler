<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="icon" href="mindful-logo-hd.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="mindful-logo-hd.jpg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-panel">
        <img class="login-logo" src="mindful-logo-hd.jpg" alt="Mindful Therapy">
        <h1>Sign in to view the dashboard</h1>
        <p class="page-subtitle">Use your Google account to access appointments and your calendar. The patient booking link stays public.</p>
        <a id="googleSignIn" class="button" href="/auth/google">Sign in with Google</a>
        <a id="openBookingPage" class="button secondary" href="book.html">Open booking page</a>
      </section>
    </main>
    <script src="config.js?v=20260914-supabase"></script>
    <script>
      const apiBase = (window.SCHEDULER_API_BASE || "").replace(/\/$/, "");
      if (apiBase) document.querySelector("#googleSignIn").href = `${apiBase}/auth/google`;
      const appBase = window.SCHEDULER_APP_BASE || "";
      if (appBase) document.querySelector("#openBookingPage").href = `${appBase}/book.html`;
    </script>
  </body>
</html>
